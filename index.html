<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boda Danna y Demian</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 60px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    .box { margin-top: 30px; }
    input { width: 100%; box-sizing: border-box; padding: 14px; font-size: 18px; }
    button { margin-top: 12px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
    #resultado { margin-top: 30px; padding: 20px; border: 1px solid #ddd; display: none; }
    .error { color: #a00; }
    li { margin: 8px 0; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Boda Danna y Demian</h1>
  <p>Escribe tu nombre para consultar tu mesa.</p>

  <div class="box">
    <input id="nombre" type="text" placeholder="Tu nombre">
    <button onclick="buscar()">Consultar mesa</button>
  </div>

  <div id="resultado"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQyR71FYjFBIPvPvzrwtd0mPISzG0cWI4NEm4zOO_QnQq0CRmaNJ50a6qMPItAYXkhr-FoZc5aFvrb2/pub?output=csv";

const datosPrueba = [
  {nombre:"Danna", mesa:"1"},
  {nombre:"Demian", mesa:"1"},
  {nombre:"Pilar", mesa:"2"}
];

let invitados = [];

function normalizar(texto) {
  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}

function parseCSV(texto) {
  const lineas = texto.trim().split(/\r?\n/);
  if (!lineas.length) return [];
  return lineas.slice(1).map(linea => {
    // Suficiente para el formato actual: Nombre,Mesa
    const partes = linea.split(",");
    return { nombre: (partes[0] || "").trim(), mesa: (partes[1] || "").trim() };
  }).filter(x => x.nombre);
}

async function cargarInvitados() {
  try {
    const respuesta = await fetch(CSV_URL, {cache: "no-store"});
    if (!respuesta.ok) throw new Error("No se pudo consultar la hoja");
    const texto = await respuesta.text();
    const datos = parseCSV(texto);
    if (!datos.length) throw new Error("La hoja no contiene datos");
    invitados = datos;
  } catch (e) {
    // Permite probar la página incluso si el navegador bloquea el CSV.
    invitados = datosPrueba;
    console.warn("Usando datos de prueba:", e);
  }
}

async function buscar() {
  if (!invitados.length) await cargarInvitados();

  const texto = document.getElementById("nombre").value;
  const buscado = normalizar(texto);
  const resultado = document.getElementById("resultado");

  if (!buscado) {
    resultado.style.display = "block";
    resultado.innerHTML = '<p class="error">Escribe tu nombre.</p>';
    return;
  }

  const invitado = invitados.find(x => normalizar(x.nombre) === buscado);

  resultado.style.display = "block";

  if (!invitado) {
    resultado.innerHTML =
      '<p class="error">No encontramos ese nombre. Revisa que esté escrito como aparece en tu invitación.</p>';
    return;
  }

  const mesa = invitado.mesa;
  const companeros = invitados
    .filter(x => String(x.mesa) === String(mesa))
    .map(x => x.nombre);

  resultado.innerHTML = `
    <h2>¡Hola, ${escapeHtml(invitado.nombre)}!</h2>
    <p>Tu mesa es la <strong>${escapeHtml(mesa)}</strong>.</p>
    <h3>Personas en tu mesa</h3>
    <ul>${companeros.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
  `;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

document.getElementById("nombre").addEventListener("keydown", e => {
  if (e.key === "Enter") buscar();
});

cargarInvitados();
</script>
</body>
</html>
