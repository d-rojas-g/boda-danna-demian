<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boda Danna y Demian</title>
<style>
body{font-family:Arial,sans-serif;max-width:680px;margin:60px auto;padding:0 20px}h1{margin-bottom:8px}.box{margin-top:30px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:18px}button{margin-top:12px;padding:12px 20px;font-size:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}#resultado{margin-top:30px;padding:20px;border:1px solid #ddd;display:none}.error{color:#a00}.cargando{color:#666}li{margin:8px 0}
</style></head>
<body>
<h1>Boda Danna y Demian</h1><p>Escribe tu nombre para consultar tu mesa.</p>
<div class="box"><input id="nombre" type="text" placeholder="Tu nombre completo" autocomplete="name">
<button id="buscarBtn" onclick="buscar()">Consultar mesa</button></div><div id="resultado"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwQH2GoASh5ztcy-Yw1zShnLR0UsI6k2COb5JFaaA4EkASNLr9QREyU6AS5s0-nSmIWug/exec";
function buscar(){
 const t=document.getElementById("nombre").value.trim(), r=document.getElementById("resultado"), b=document.getElementById("buscarBtn");
 r.style.display="block"; if(!t){r.innerHTML='<p class="error">Escribe tu nombre para continuar.</p>';return;}
 b.disabled=true;r.innerHTML='<p class="cargando">Consultando la lista...</p>';
 const cb="respuesta_"+Date.now()+"_"+Math.floor(Math.random()*100000);
 window[cb]=d=>{try{mostrar(d,r)}finally{delete window[cb];const s=document.getElementById(cb);if(s)s.remove();b.disabled=false;}};
 const s=document.createElement("script");s.id=cb;s.src=API_URL+"?nombre="+encodeURIComponent(t)+"&callback="+cb;
 s.onerror=()=>{r.innerHTML='<p class="error">No pudimos consultar la lista. Intenta nuevamente.</p>';delete window[cb];s.remove();b.disabled=false;};
 document.body.appendChild(s);
}
function mostrar(d,r){
 if(!d||!d.ok){r.innerHTML='<p class="error">'+esc(d&&d.error||"No encontramos ese nombre.")+'</p><p>Prueba escribiendo tu nombre y apellido.</p>';return;}
 r.innerHTML='<h2>¡Hola, '+esc(d.nombre)+'!</h2><p>Tu mesa es la <strong>'+esc(d.mesa)+'</strong>.</p><h3>Personas en tu mesa</h3><ul>'+d.personas.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
document.getElementById("nombre").addEventListener("keydown",e=>{if(e.key==="Enter")buscar()});
</script></body></html>
